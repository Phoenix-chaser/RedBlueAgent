llm:
  # provider: anthropic | deepseek | moonshot | zhipu | openai
  # Leave blank to auto-detect from environment variables
  provider: ""
  model: ""                   # Leave blank to use provider default
  max_tokens: 8192
  temperature: 0.1
  # Token estimate that triggers history compression (HierarchicalSummarizer)
  context_window_budget: 130000
  keep_recent_turns: 20

  # Per-provider context window recommendations:
  # anthropic  claude-sonnet-4-6    : 200000 tokens
  # deepseek   deepseek-chat        : 65536 tokens  → set budget to 55000
  # moonshot   moonshot-v1-128k     : 131072 tokens → set budget to 110000
  # zhipu      glm-4                : 128000 tokens → set budget to 100000

agent:
  max_iterations: 200
  max_stage_iterations: 30

# Tool timeouts and parameter defaults are set per-tool in
# modules/tool_invocation/ (class attributes + params/ interpreters).

security:
  require_approval_for_exploits: true
  # Dangerous-op approval policy:
  #   "" (default)      interactive prompt on a TTY, reject when headless
  #   interactive       always prompt on stdin
  #   reject            deny dangerous ops headless, no prompting
  #   auto-approve-scan auto-approve scan-flavored dangerous ops
  #                     (sqlmap --level>=3, metasploit auxiliary/), deny the rest
  #   file              park requests under data/approvals/<sid>/pending/ and
  #                     wait for decisions/<id>.json (default deny on timeout)
  # Can be overridden with env SECURITY_APPROVAL_POLICY.
  # The always-deny patterns live in security/approval_gate.py
  # (ALWAYS_REQUIRE_APPROVAL) — they are policy-independent.
  approval_policy: ""

rag:
  vector_store_dir: data/knowledge_base/vector_store

storage:
  sessions_dir: data/sessions
  reports_dir: data/reports
  audit_log: data/audit.log

context_guard:
  enabled: true
  honeypot_threshold: 2       # quarantine events before honeypot flag
  strict: false               # true = refuse to start when the blueteam model fails to load
